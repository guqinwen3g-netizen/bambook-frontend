:root{
  --font:Urbanist,"HarmonyOS Sans SC","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --mist-1:#7FA3B3;--mist-2:#A2C0CD;--mist-3:#C6DAE3;--deep-1:#101C35;--deep-2:#162640;--deep-3:#213551;--cyan:#8DD5DE;--wisteria:#C8B8E0;
  --shell:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.28),rgba(255,255,255,0) 52%),linear-gradient(160deg,var(--mist-1) 0%,var(--mist-2) 48%,var(--mist-3) 100%);
  --hero:radial-gradient(110% 140% at 10% -10%,rgba(255,255,255,.34),rgba(255,255,255,0) 55%),linear-gradient(150deg,#6F97A9 0%,#8FB3C2 46%,#BBD3DE 100%);
  --canvas:#F2F5F7;--card:#FFFFFF;--card-2:#F7F9FA;--sunken:#EAF0F3;--line:rgba(16,42,58,.075);--line-2:rgba(16,42,58,.12);
  --ink:#0E1A21;--ink-2:rgba(14,26,33,.60);--ink-3:rgba(14,26,33,.42);--ink-4:rgba(14,26,33,.16);
  --side-ink:#FFFFFF;--side-ink-2:rgba(255,255,255,.80);--side-ink-3:rgba(255,255,255,.62);--side-active:rgba(255,255,255,.26);--side-hover:rgba(255,255,255,.14);
  --accent:#34768D;--accent-hover:#2C6377;--accent-ink:#275768;--on-accent:#FFFFFF;--accent-tint:rgba(52,118,141,.09);--accent-tint-2:rgba(52,118,141,.16);
  --ok:#409660;--ok-tint:rgba(64,150,96,.12);--ok-ink:#2F7A4B;--warn:#C4A445;--warn-tint:rgba(196,164,69,.16);--warn-ink:#866C1E;--bad:#BC4950;--bad-tint:rgba(188,73,80,.11);--bad-ink:#9F383F;
  --ai:#8D78B8;--ai-tint:rgba(200,184,224,.32);--ai-ink:#5E4A8C;
  --shadow-1:0 1px 2px rgba(18,44,60,.04),0 6px 20px -8px rgba(18,44,60,.10);--shadow-2:0 2px 6px rgba(18,44,60,.05),0 24px 48px -20px rgba(18,44,60,.22);
  --r-canvas:30px;--r-card:22px;color-scheme:light}
[data-theme="dark"]{
  --shell:radial-gradient(120% 90% at 0% 0%,rgba(141,213,222,.10),rgba(141,213,222,0) 50%),linear-gradient(160deg,var(--deep-1) 0%,var(--deep-2) 50%,var(--deep-3) 100%);
  --hero:radial-gradient(110% 140% at 8% -10%,rgba(141,213,222,.22),rgba(141,213,222,0) 55%),linear-gradient(150deg,#14284A 0%,#1B3557 52%,#25476A 100%);
  --canvas:#0C1629;--card:#132139;--card-2:#172843;--sunken:#0A1324;--line:rgba(190,225,240,.08);--line-2:rgba(190,225,240,.14);
  --ink:#EEF4F6;--ink-2:rgba(238,244,246,.64);--ink-3:rgba(238,244,246,.44);--ink-4:rgba(238,244,246,.14);
  --side-ink:#EEF4F6;--side-ink-2:rgba(238,244,246,.74);--side-ink-3:rgba(238,244,246,.50);--side-active:rgba(141,213,222,.14);--side-hover:rgba(141,213,222,.07);
  --accent:#8DD5DE;--accent-hover:#A8E1E8;--accent-ink:#9FDDE5;--on-accent:#0B1A2C;--accent-tint:rgba(141,213,222,.10);--accent-tint-2:rgba(141,213,222,.18);
  --ok:#7DCA99;--ok-tint:rgba(125,202,153,.13);--ok-ink:#92D3AA;--warn:#D6BC71;--warn-tint:rgba(214,188,113,.14);--warn-ink:#DCC98F;--bad:#CF7D82;--bad-tint:rgba(207,125,130,.14);--bad-ink:#DD979B;
  --ai:#C8B8E0;--ai-tint:rgba(200,184,224,.13);--ai-ink:#D5C9EA;
  --shadow-1:0 1px 2px rgba(0,0,0,.25),0 10px 24px -12px rgba(0,0,0,.5);--shadow-2:0 2px 8px rgba(0,0,0,.3),0 30px 60px -24px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--shell);background-attachment:fixed;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px}svg.i.xs{width:13px;height:13px}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
/* shell */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;transition:grid-template-columns .45s cubic-bezier(.22,1,.36,1)}
.app.collapsed{grid-template-columns:76px 1fr}
.side{display:flex;flex-direction:column;padding:22px 14px 16px;color:var(--side-ink);min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 0;height:40px}
.brand .mark{width:30px;height:30px;color:#fff;flex:none;animation:float 8s ease-in-out infinite}
[data-theme="dark"] .brand .mark{color:var(--cyan)}
.brand .word{font-size:17px;font-weight:400;white-space:nowrap}
.brand .word small{font-size:13px;margin-left:4px;opacity:.9}
.side-toggle{margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--side-ink-2)}
.side-toggle:hover{background:var(--side-hover)}
@keyframes float{0%,100%{transform:rotate(0)}50%{transform:rotate(30deg)}}
.ws{margin:22px 4px 10px;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);text-align:left}
[data-theme="dark"] .ws{background:rgba(141,213,222,.06);box-shadow:inset 0 0 0 1px rgba(141,213,222,.10)}
.ws-sym{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:600;font-size:13px;background:rgba(255,255,255,.92);color:var(--accent-ink);flex:none}
[data-theme="dark"] .ws-sym{background:var(--cyan);color:var(--deep-1)}
.ws b{font-weight:500;font-size:13.5px;display:block;line-height:1.2}
.ws small{color:var(--side-ink-3);font-size:11.5px}
.ws>.i{margin-left:auto;color:var(--side-ink-3)}
.search-btn{margin:4px 4px 12px;display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:12px;color:var(--side-ink-2);font-size:13px}
.search-btn:hover{background:var(--side-hover)}
.search-btn kbd{margin-left:auto;font-family:var(--font);font-size:11px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.2)}
[data-theme="dark"] .search-btn kbd{background:rgba(141,213,222,.08)}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 2px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-group{margin-bottom:4px}
.nav-head{width:100%;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;font-size:11.5px;letter-spacing:.06em;color:var(--side-ink-3);border-radius:8px;white-space:nowrap}
.nav-head:hover{color:var(--side-ink-2)}
.nav-head .i{margin-left:auto;transition:transform .3s}
.nav-group.closed .nav-head .i{transform:rotate(-90deg)}
.nav-items{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s cubic-bezier(.22,1,.36,1)}
.nav-group.closed .nav-items{grid-template-rows:0fr}
.nav-items>div{overflow:hidden}
.nav-item{position:relative;width:100%;display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:12px;color:var(--side-ink-2);font-size:13.5px;white-space:nowrap;transition:background .2s,color .2s}
.nav-item:hover{background:var(--side-hover);color:var(--side-ink)}
.nav-item.active{background:var(--side-active);color:var(--side-ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}
[data-theme="dark"] .nav-item.active{box-shadow:inset 0 0 0 1px rgba(141,213,222,.16);color:var(--cyan)}
.nav-item .count{margin-left:auto;font-size:11px;min-width:20px;height:18px;padding:0 6px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.24)}
[data-theme="dark"] .nav-item .count{background:rgba(141,213,222,.12)}
.side-ai{margin:10px 2px;padding:14px;border-radius:18px;background:linear-gradient(150deg,rgba(255,255,255,.30),rgba(255,255,255,.12));box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);text-align:left}
[data-theme="dark"] .side-ai{background:linear-gradient(150deg,rgba(200,184,224,.14),rgba(141,213,222,.05));box-shadow:inset 0 0 0 1px rgba(200,184,224,.16)}
.side-ai .t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.side-ai .t .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--wisteria);color:#3E2F66}
.side-ai p{margin-top:6px;font-size:12px;color:var(--side-ink-2);line-height:1.45}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;text-align:left}
.me:hover{background:var(--side-hover)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500;flex:none;background:var(--accent-tint-2);color:var(--accent-ink)}
.side .av{background:rgba(255,255,255,.92);color:var(--accent-ink)}
[data-theme="dark"] .side .av{background:var(--cyan);color:var(--deep-1)}
.me b{display:block;font-weight:500;font-size:13px;line-height:1.2}
.me small{font-size:11.5px;color:var(--side-ink-3)}
.me>.i{margin-left:auto;color:var(--side-ink-3)}
.collapsed .brand .word,.collapsed .ws>div,.collapsed .ws>.i,.collapsed .search-btn span,.collapsed .search-btn kbd,.collapsed .nav-head,.collapsed .nav-item span,.collapsed .nav-item .count,.collapsed .side-ai,.collapsed .me>div,.collapsed .me>.i,.collapsed .side-toggle{display:none}
.collapsed .brand{justify-content:center;cursor:pointer;padding:4px 0}
.collapsed .ws{justify-content:center;padding:9px 0}
.collapsed .nav-item,.collapsed .search-btn{justify-content:center;padding:0}
.collapsed .nav-group.closed .nav-items{grid-template-rows:1fr}
/* canvas */
.canvas{margin:10px 10px 10px 0;background:var(--canvas);border-radius:var(--r-canvas);display:flex;flex-direction:column;min-width:0;min-height:0;box-shadow:0 0 0 1px rgba(255,255,255,.35),0 30px 80px -40px rgba(20,50,70,.45);overflow:hidden}
[data-theme="dark"] .canvas{box-shadow:0 0 0 1px rgba(141,213,222,.07),0 30px 80px -30px rgba(0,0,0,.6)}
.topbar{display:flex;align-items:center;gap:12px;height:64px;padding:0 24px 0 32px;flex:none;border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{font-weight:500;color:var(--ink)}
.crumbs button:hover{color:var(--ink)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);position:relative;transition:background .2s,color .2s;flex:none}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn .pip{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--canvas)}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);margin-right:8px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-tint)}
.ask-btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 12px;border-radius:12px;font-size:13px;font-weight:500;color:var(--ai-ink);background:var(--ai-tint);margin-left:6px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 32px 48px}
.scroll::-webkit-scrollbar{width:10px}.scroll::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:10px;border:3px solid var(--canvas)}
.page{max-width:1240px;margin:0 auto;animation:enter .55s cubic-bezier(.22,1,.36,1) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink-3)}
.h1{font-size:34px;font-weight:400;letter-spacing:-.015em;line-height:1.15}
.h2{font-size:17px;font-weight:500}
.sub{color:var(--ink-2);font-size:14px}
.muted{color:var(--ink-3)}
.page-head{display:flex;align-items:flex-end;gap:24px;padding:16px 0 24px}
.page-head .lead{display:flex;flex-direction:column;gap:8px}
.page-head .acts{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .2s,transform .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 18px -10px var(--accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{background:var(--card-2)}
.btn.quiet{color:var(--ink-2);padding:0 10px}
.btn.quiet:hover{background:var(--sunken);color:var(--ink)}
.btn.white{background:#fff;color:#16384A}
.btn.glass{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.38)}
.btn.glass:hover{background:rgba(255,255,255,.26)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);gap:2px}
.seg button{height:32px;padding:0 13px;border-radius:9px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-1)}
[data-theme="dark"] .seg button.on{background:var(--card-2)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--sunken);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.plain::before{display:none}
.pill.blue{background:var(--accent-tint);color:var(--accent-ink)}.pill.ok{background:var(--ok-tint);color:var(--ok-ink)}.pill.warn{background:var(--warn-tint);color:var(--warn-ink)}.pill.bad{background:var(--bad-tint);color:var(--bad-ink)}.pill.ai{background:var(--ai-tint);color:var(--ai-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:11px;font-size:13px;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2);background:var(--card)}
.chip:hover{color:var(--ink)}
.chip b{font-weight:500;color:var(--ink)}
.link{color:var(--accent-ink);font-size:13px;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line)}
.card-h{display:flex;align-items:center;gap:12px;padding:20px 22px 0}
.card-h .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.grid{display:grid;gap:18px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
/* home */
.greet .h1{font-size:40px}
.greet .h1 em{font-style:normal;color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:18px}
.stat{padding:18px 20px 16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-2),inset 0 0 0 1px var(--line)}
.stat .top{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2)}
.stat .top .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--sunken)}
.stat .top .delta{margin-left:auto;font-size:12px}
.stat .v{font-size:38px;font-weight:300;letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline;gap:8px}
.stat .v small{font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.stat .foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-3);gap:10px}
.spark{height:28px;width:96px;flex:none}
.hero{position:relative;border-radius:26px;background:var(--hero);color:#fff;overflow:hidden;min-height:360px;padding:28px 30px;display:flex;flex-direction:column;box-shadow:var(--shadow-2)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);pointer-events:none}
.hero .ring{position:absolute;right:-70px;top:-90px;width:430px;height:430px;color:rgba(255,255,255,.13);pointer-events:none}
[data-theme="dark"] .hero .ring{color:rgba(141,213,222,.08)}
.hero .garment{position:absolute;right:40px;bottom:-34px;height:112%;filter:drop-shadow(0 30px 40px rgba(10,30,45,.3));pointer-events:none;transition:transform .8s cubic-bezier(.22,1,.36,1)}
.hero:hover .garment{transform:translateY(-6px) rotate(-1deg)}
.hero .meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:rgba(255,255,255,.86);position:relative}
.hero .meta .tag{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.32);color:#fff}
.hero h2{position:relative;margin-top:18px;font-size:32px;font-weight:400;letter-spacing:-.01em;line-height:1.15;max-width:420px}
.hero .desc{position:relative;margin-top:10px;font-size:14px;color:rgba(255,255,255,.86);max-width:360px}
.hero .steps{position:relative;margin-top:auto;display:flex;gap:6px;max-width:430px;padding-top:24px}
.hero .steps div{flex:1;display:flex;flex-direction:column;gap:8px;font-size:11.5px;color:rgba(255,255,255,.74)}
.hero .steps div i{height:3px;border-radius:3px;background:rgba(255,255,255,.3)}
.hero .steps div.done i{background:rgba(255,255,255,.9)}
.hero .steps div.now i{background:linear-gradient(90deg,#fff 50%,rgba(255,255,255,.3) 50%)}
.hero .steps div.now{color:#fff;font-weight:500}
[data-theme="dark"] .hero .steps div.done i{background:var(--cyan)}
[data-theme="dark"] .hero .steps div.now i{background:linear-gradient(90deg,var(--cyan) 50%,rgba(255,255,255,.18) 50%)}
.hero .cta{position:relative;display:flex;gap:10px;margin-top:22px}
[data-theme="dark"] .hero .btn.white{background:var(--cyan);color:var(--deep-1)}
.brief{display:flex;flex-direction:column;background:linear-gradient(170deg,var(--ai-tint),transparent 62%),var(--card)}
.badge{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--wisteria);color:#3E2F66;flex:none}
.brief ul{list-style:none;display:flex;flex-direction:column;gap:2px;padding:12px 14px 0}
.brief li{display:flex;gap:12px;padding:10px 8px;border-radius:12px;font-size:13.5px;line-height:1.5;cursor:pointer}
.brief li:hover{background:var(--card-2)}
.brief li .n{width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:11px;background:var(--sunken);color:var(--ink-2);margin-top:1px}
.brief li b{font-weight:500}
.brief .ask{margin:auto 18px 18px;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;border-radius:14px;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-3);font-size:13px;text-align:left}
.brief .ask .go,.composer .go{margin-left:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--ai);color:#fff;flex:none}
[data-theme="dark"] .brief .ask .go,[data-theme="dark"] .composer .go{color:var(--deep-1)}
.tasks{padding:8px 10px 10px}
.task{width:100%;display:grid;grid-template-columns:70px 1fr auto auto 22px;align-items:center;gap:16px;padding:14px 12px;border-radius:14px;cursor:pointer;text-align:left;transition:background .2s}
.task+.task{box-shadow:0 -1px 0 var(--line)}
.task:hover{background:var(--card-2)}
.task .when{font-size:12.5px;color:var(--ink-3)}
.task .when.today{color:var(--bad-ink);font-weight:500}
.task .t{font-size:14.5px;font-weight:500;line-height:1.35}
.task .d{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.task .go{color:var(--ink-3);transition:transform .2s,color .2s}
.task:hover .go{transform:translateX(3px);color:var(--accent-ink)}
.stack{display:flex}
.stack .av{width:26px;height:26px;font-size:10.5px;box-shadow:0 0 0 2px var(--card)}
.stack .av+.av{margin-left:-7px}
.av.b{background:var(--ok-tint);color:var(--ok-ink)}.av.c{background:var(--warn-tint);color:var(--warn-ink)}.av.d{background:var(--ai-tint);color:var(--ai-ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:16px 18px 6px}
.week button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;font-size:11px;color:var(--ink-3)}
.week button:hover{background:var(--card-2)}
.week button b{font-size:16px;font-weight:500;color:var(--ink)}
.week button.on{background:var(--accent);color:var(--on-accent)}
.week button.on b{color:var(--on-accent)}
.week .dots{display:flex;gap:3px;height:4px}
.week .dots i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.week button.on .dots i{background:var(--on-accent)}
.agenda{padding:8px 18px 18px;display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:44px 1fr;gap:12px}
.ev .tm{font-size:12.5px;color:var(--ink-3);padding-top:10px}
.ev .box{padding:11px 14px;border-radius:14px;background:var(--card-2);box-shadow:inset 3px 0 0 var(--accent)}
.ev .box.alt{box-shadow:inset 3px 0 0 var(--wisteria)}.ev .box.mute{box-shadow:inset 3px 0 0 var(--ink-4)}
.ev .box b{font-weight:500;font-size:13.5px;display:block}
.ev .box small{font-size:12px;color:var(--ink-3)}
/* list */
.tabs{display:flex;gap:26px;box-shadow:inset 0 -1px 0 var(--line);margin-bottom:18px}
.tabs button{position:relative;height:42px;font-size:14.5px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.tabs button span{font-size:12px;padding:1px 7px;border-radius:7px;background:var(--sunken);color:var(--ink-2)}
.tabs button.on{color:var(--ink);font-weight:500}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--accent)}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-3);min-width:280px}
.field input{border:0;outline:0;background:none;flex:1;font-size:13.5px;color:var(--ink);min-width:0}
.field input::placeholder{color:var(--ink-3)}
.toolbar .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:18px}
.pipeline button{padding:14px 16px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:8px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);transition:background .2s}
.pipeline button:hover{background:var(--card-2)}
.pipeline button.on{background:var(--accent-tint);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pipeline small{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.pipeline small i{width:7px;height:7px;border-radius:50%}
.pipeline b{font-size:26px;font-weight:300;line-height:1}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.thead,.row{display:grid;grid-template-columns:minmax(200px,2.2fr) 44px 112px 70px 118px 16px;align-items:center;gap:14px;padding:0 18px}
.thead{height:44px;font-size:12px;color:var(--ink-3);box-shadow:inset 0 -1px 0 var(--line)}
.thead span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.row{min-height:78px;cursor:pointer;position:relative;width:100%;text-align:left;transition:background .2s}
.row+.row{box-shadow:inset 0 1px 0 var(--line)}
.row:hover{background:var(--card-2)}
.row.sel{background:var(--accent-tint)}
.row.sel::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.obj{display:flex;align-items:center;gap:14px;min-width:0}
.thumb{width:48px;height:56px;border-radius:12px;background:linear-gradient(160deg,var(--sunken),var(--card-2));display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.thumb img{max-height:46px;max-width:40px;object-fit:contain}
.obj>div{min-width:0}
.obj .nm{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj .sm{font-size:12px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--ink-4)}
.prog i.d{background:var(--accent)}
.prog i.n{background:linear-gradient(90deg,var(--accent) 55%,var(--ink-4) 55%)}
.stage-cell small{display:block;font-size:12px;color:var(--ink-3);margin-top:7px;white-space:nowrap}
.due b{font-weight:500;font-size:13.5px;display:block}
.due small{font-size:12px;color:var(--ink-3)}
.due.late b,.due.late small{color:var(--bad-ink)}
.row .go{color:var(--ink-3)}
.tfoot{display:flex;align-items:center;gap:12px;padding:12px 20px;font-size:12.5px;color:var(--ink-3);box-shadow:inset 0 1px 0 var(--line)}
.tfoot .pg{margin-left:auto;display:flex;align-items:center;gap:4px}
.preview{position:sticky;top:0;overflow:hidden}
.preview .stage{position:relative;height:250px;background:radial-gradient(70% 70% at 50% 40%,rgba(255,255,255,.65),transparent 70%),linear-gradient(165deg,var(--sunken),var(--card-2));display:grid;place-items:center}
[data-theme="dark"] .preview .stage{background:radial-gradient(70% 70% at 50% 40%,rgba(141,213,222,.10),transparent 70%),linear-gradient(165deg,var(--sunken),var(--card-2))}
.preview .stage img{height:210px;filter:drop-shadow(0 18px 24px rgba(10,30,45,.2));animation:enter .5s both}
.preview .stage .pill{position:absolute;left:16px;top:16px}
.preview .stage .ver{position:absolute;right:16px;top:16px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);padding:3px 8px;border-radius:7px;background:var(--card)}
.pv-b{padding:18px 20px 20px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding:16px 0 18px}
.facts div small{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.facts div b{font-weight:500;font-size:13.5px}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);padding-top:8px}
.back:hover{color:var(--ink)}
.idrow{display:flex;align-items:center;gap:18px;padding:16px 0 22px}
.idrow .thumb{width:64px;height:76px;border-radius:16px}.idrow .thumb img{max-height:64px;max-width:54px}
.idrow .ttl{display:flex;flex-direction:column;gap:6px;min-width:0}
.idrow .ttl .h1{font-size:30px}
.idrow .ttl .meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.idrow .ttl .meta i{width:3px;height:3px;border-radius:50%;background:var(--ink-3)}
.idrow .people{margin-left:auto;display:flex;gap:28px;align-items:center}
.idrow .people>div small{display:block;font-size:11.5px;color:var(--ink-3)}
.idrow .people>div b{font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:7px;margin-top:2px;white-space:nowrap}
.idrow .people .av{width:22px;height:22px;font-size:10px}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px;margin-bottom:18px}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;text-align:left;transition:background .2s}
.step:hover{background:var(--card-2)}
.step .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;box-shadow:inset 0 0 0 1.5px var(--ink-4);color:var(--ink-3)}
.step.done .k{background:var(--accent-tint);box-shadow:none;color:var(--accent-ink)}
.step.now{background:var(--accent);color:var(--on-accent)}
.step.now:hover{background:var(--accent-hover)}
.step.now .k{background:rgba(255,255,255,.22);box-shadow:none;color:var(--on-accent)}
[data-theme="dark"] .step.now .k{background:rgba(11,26,44,.15)}

.ohead>div+div{box-shadow:none;border-left:1px solid var(--line)}
.check .bx{box-shadow:none;background:var(--fill-2)}
.donut .lg i[style*="sunken"]{box-shadow:none!important;background:var(--fill-2)!important}
.flow .node.now .k{box-shadow:none}
.icon-btn .pip{box-shadow:none}
.sync i{box-shadow:none}

.palette,.drawer{box-shadow:0 30px 80px -30px rgba(10,30,45,.35);background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(24px) saturate(1.2)}

.palette .q{border-bottom:1px solid var(--line)}.palette .ft{border-top:1px solid var(--line)}

.sugg button{box-shadow:none;background:var(--fill)}

.toast{box-shadow:none}

function spark(pts){
  const w=96,h=28,max=Math.max(...pts),min=Math.min(...pts);
  const xy=pts.map((p,i)=>[i*(w/(pts.length-1)),h-3-((p-min)/(max-min||1))*(h-8)]);
  const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/></svg>`;
}

          <button data-a="nav" data-v="order"><span class="ic">${ic('clipboard-list','s')}</span><span><b>SO-G-2026-018</b><small>确认后可转入订单</small></span>${ic('chevron-right','s go')}</button>
        </div></article></div>
    </div></div>`;
}

/* ── Order ── */
function order(){
  const nodes=[['下单','10/02','handshake',2],['采购','10/06','package',2],['生产','进行中','factory',1],['尾期 QC','10/28','badge-check',0],['出运','11/08','ship',0],['收款','11/30','wallet',0]];
  const lines=[['双面羊毛城市大衣','CC-AW27-COAT-014','coat',1200,'64.00',72,18],['雾蓝精纺羊毛西装','CC-AW27-SUIT-006','suit',800,'48.50',58,10],['炭灰细格轻结构 Blazer','CC-AW27-CHECK-003','blazer',600,'42.00',35,0]];
  return `<div class="page"><section class="page-head"><div class="lead"><span class="eyebrow">订单履约 · 订单</span><h1 class="h1">SO-G-2026-018</h1><p class="sub">Cedar & Crown · AW27 首批 · 3 个条目 · 负责人 顾言</p></div>
    <div class="acts"><button class="btn ghost" data-a="toast" data-m="装箱单草稿已打开">${ic('file-text','s')}装箱单</button><button class="btn primary" data-a="toast" data-m="已通知后勤核对出运准备">${ic('send','s')}交接后勤</button></div></section>
    <section class="card ohead"><div><small>订单金额</small><div class="big">140,800<small class="muted">USD</small></div><div class="hint">FOB 上海 · T/T 30/70</div></div>
      <div><small>总数量</small><div class="big">2,600<small class="muted">件</small></div><div class="hint">3 个条目</div></div>
      <div><small>交期</small><div class="big">11/08</div><div class="hint">剩余 27 天</div></div>
      <div><small>整体进度</small><div class="big">58<small class="muted">%</small></div><div class="hint" style="color:var(--ok-ink)">按计划</div></div></section>
    <section class="card" style="margin-bottom:18px"><div class="card-h"><div class="h2">履约进度</div><div class="tools">${pill('blue','生产中')}</div></div>
      <div class="flow">${nodes.map(([l,s,i,st],k)=>`${k?`<span class="bar ${st?'d':''}"></span>`:''}<div class="node ${st===2?'done':st===1?'now':''}"><span class="k">${st===2?ic('check'):ic(i)}</span><b>${l}</b><small>${s}</small></div>`).join('')}</div></section>
    <section class="grid ord-grid">
      <article class="card c8"><div class="card-h"><div class="h2">条目</div><div class="tools"><span class="muted" style="font-size:12.5px">生产 <span style="color:var(--accent-ink)">●</span> · 已 QC <span style="color:var(--ok)">●</span></span></div></div>
        <div class="lrow h"><span>款式</span><span class="r">数量</span><span class="r">单价 USD</span><span>生产进度</span><span class="r">小计</span></div>
        ${lines.map(([n,s,im,q,p,g,qc])=>`<div class="lrow"><div class="obj"><span class="thumb">${`<img src="${IMG[im]}" alt="">`}</span><div><div class="nm">${n}</div><div class="sm mono">${s}</div></div></div><span class="r">${q.toLocaleString()}</span><span class="r">${p}</span>
          <div class="meter"><div class="tr"><i style="width:${qc}%" class="q"></i><i style="width:${g-qc}%"></i></div><span>${g}% · 已 QC ${qc}%</span></div><b class="r" style="font-weight:500">${(q*p).toLocaleString('en-US',{maximumFractionDigits:0})}</b></div>`).join('')}
      </article>
      <div class="c4" style="display:flex;flex-direction:column;gap:18px">
        <article class="card"><div class="card-h"><div class="h2">出运准备</div><div class="tools"><span class="muted" style="font-size:12.5px">2 / 5</span></div></div>
          <div class="check">${[['装箱单草稿',1,'顾言'],['唛头确认',1,'客户'],['尾期 QC 预约',0,'10/28'],['报关资料',0,'缺 1 份'],['订舱',0,'后勤']].map(([l,ok,s])=>`<div class="${ok?'ok':''}"><span class="bx">${ok?ic('check','xs'):''}</span><span>${l}</span><small style="${!ok&&s.startsWith('缺')?'color:var(--bad-ink)':''}">${s}</small></div>`).join('')}</div></article>
        <article class="card"><div class="card-h"><div class="h2">收款</div></div>
          <div class="donut"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--sunken)" stroke-width="5"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--accent)" stroke-width="5" stroke-dasharray="30 70" stroke-dashoffset="25" stroke-linecap="round"/><text x="21" y="22.5" text-anchor="middle" font-size="7" fill="var(--ink)" font-family="Urbanist" font-weight="300">30%</text><text x="21" y="28" text-anchor="middle" font-size="2.8" fill="var(--ink-3)">已收</text></svg>
            <div class="lg"><div><i style="background:var(--accent)"></i>定金已收<b>42,240</b></div><div><i style="background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line-2)"></i>尾款待收<b>98,560</b></div><div class="muted" style="font-size:12px">尾款于提单日后 30 天</div></div></div></article>
      </div></section></div>`;
}

/* ── Overlays ── */
function palette(){
  if(!S.palette) return '';
  const q=S.pq.toLowerCase();
  const items=[...DEVS.map((d,i)=>({g:'开发案',l:d.name,s:d.id,img:d.img,a:'open',i})),{g:'订单',l:'SO-G-2026-018',s:'Cedar & Crown',icon:'clipboard-list',a:'nav',v:'order'},
    {g:'跳转',l:'我的工作',s:'G H',icon:'layout-grid',a:'nav',v:'home'},{g:'跳转',l:'开发与寻样',s:'G D',icon:'layers',a:'nav',v:'list'},{g:'操作',l:'切换深浅色',s:'⇧ T',icon:'moon',a:'theme'},{g:'操作',l:'问竹衍助手',s:'⌘ J',icon:'sparkles',a:'ai'}]
    .filter(x=>!q||(x.l+x.s).toLowerCase().includes(q));
  const groups=[...new Set(items.map(x=>x.g))];
  return `<div class="scrim" data-a="close"></div><div class="palette" role="dialog" aria-label="搜索">
    <div class="q">${ic('search')}<input id="pq" placeholder="搜索开发案、订单、客户，或输入命令…" value="${esc(S.pq)}"><kbd>ESC</kbd></div>
    ${groups.length?groups.map(g=>`<div class="grp"><small>${g}</small>${items.filter(x=>x.g===g).slice(0,4).map(x=>`<button class="it" data-a="${x.a}" data-i="${x.i??''}" data-v="${x.v||''}"><span class="ic">${x.img?`<img src="${IMG[x.img]}" alt="">`:ic(x.icon,'s')}</span>${x.l}<small class="${x.g==='开发案'?'mono':''}">${x.s}</small></button>`).join('')}</div>`).join(''):`<div class="empty">没有找到「${esc(S.pq)}」</div>`}
    <div class="ft"><span>↑↓ 选择</span><span>↵ 打开</span><span>⌘K 随时唤起</span></div></div>`;
}
const AI_INIT=[{r:'a',t:'下午好，顾言。我已读取你今天的 4 项待办、2 份 QC 报告和 SO-G-2026-018 的最新动态。<br><br>最值得先处理的是 <b>双面羊毛城市大衣 R2-A-2</b>：QC 已通过，客户邮件也已明确认可，只差你登记确认。',src:['QC-G-2026-0086','邮件 · Re: AW27 Coat R2'],act:1}];
function ai(){
  if(!S.ai) return '';
  const m=S.msgs||AI_INIT;
  return `<div class="scrim" data-a="close"></div><aside class="drawer" role="dialog" aria-label="竹衍助手">
    <div class="dh"><span class="badge">${ic('sparkles')}</span><div><b>竹衍助手</b><small>基于成衣一组的业务数据回答</small></div><button class="icon-btn" data-a="close" aria-label="关闭">${ic('x')}</button></div>
    <div class="msgs" id="msgs">${m.map(x=>x.r==='u'?`<div class="msg u">${esc(x.t)}</div>`:x.r==='t'?`<div class="msg a"><div class="bub typing"><i></i><i></i><i></i></div></div>`:`<div class="msg a"><div class="bub">${x.t}</div>${x.src?`<div class="src">${x.src.map(s=>`<span>${ic('link-2','xs')}${s}</span>`).join('')}</div>`:''}${x.act?`<div class="acts"><button class="btn primary sm" data-a="open" data-i="0">去确认</button><button class="btn ghost sm" data-a="toast" data-m="已生成确认摘要草稿">生成摘要</button></div>`:''}</div>`).join('')}</div>
    <div class="sugg">${['细格 Blazer 为什么要复验？','SO-G-2026-018 还缺什么？','起草给江南成衣的提醒'].map(s=>`<button data-a="ask" data-m="${s}">${s}</button>`).join('')}</div>
    <div class="composer"><textarea id="aiq" placeholder="问竹衍，或让它帮你做事…"></textarea><button class="go" data-a="send" aria-label="发送">${ic('arrow-up-right','s')}</button></div></aside>`;
}
const ANSWERS={
  '细格 Blazer 为什么要复验？':'QC 许言在 <b>R2-A-2</b> 的评审中记录袖长实测 64.7cm，标准 63.5cm，偏差 <b>+1.2cm</b>，超出 ±1.0cm 公差。江南成衣已按结论修正，新样预计 <b>10/14</b> 到达，到样后需重新评审。',
  'SO-G-2026-018 还缺什么？':'出运准备完成 2/5。缺口：<br>· <b>报关资料</b> 缺面料成分声明 1 份<br>· <b>尾期 QC</b> 待预约（建议 10/28）<br>· <b>订舱</b> 由后勤在 QC 后安排<br>交期 11/08，目前进度按计划。',
  '起草给江南成衣的提醒':'草稿：<br><br>“王经理您好，DEV-G-2026-021 细格 Blazer 新样请于 10/14 前寄达，重点复核袖长（目标 63.5cm ±1.0）。如有延期请提前告知，谢谢。—— 顾言”'
};
function toast(){ return S.toast ? `<div class="toast" role="status">${ic('circle-check','s')}${esc(S.toast)}</div>` : ''; }

/* ── Render ── */
const VIEWS={home,list,detail,order};
let scrollTop=0;
function render(keepScroll){
  document.documentElement.dataset.theme=S.theme;
  const sc=document.querySelector('.scroll'); if(sc&&keepScroll) scrollTop=sc.scrollTop;
  document.getElementById('root').innerHTML=`<div class="app ${S.collapsed?'collapsed':''}">${sidebar()}<main class="canvas">${topbar()}<div class="scroll" id="scroll">${VIEWS[S.view]()}</div></main></div>${palette()}${ai()}${toast()}`;
  const s2=document.getElementById('scroll');
  if(keepScroll){ s2.scrollTop=scrollTop; s2.querySelector('.page').style.animation='none'; }
  s2.addEventListener('scroll',()=>document.getElementById('topbar').classList.toggle('scrolled',s2.scrollTop>4));
  const q=document.getElementById('q'); if(q){ q.oninput=e=>{S.q=e.target.value;render(true);const n=document.getElementById('q');n.focus();n.setSelectionRange(n.value.length,n.value.length);} }
  const pq=document.getElementById('pq'); if(pq){ pq.focus(); pq.setSelectionRange(pq.value.length,pq.value.length); pq.oninput=e=>{S.pq=e.target.value;render(true);} }
  const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight;
  const aq=document.getElementById('aiq'); if(aq){ aq.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(aq.value);} }; }
}
let tt; function say(t){ S.toast=t; render(true); clearTimeout(tt); tt=setTimeout(()=>{S.toast='';render(true);},2600); }
function go(v){ S.view=v; S.palette=false; S.ai=false; render(); }
function open(i){ S.sel=DEVS[+i]; S.ver=S.sel.ver==='—'?'—':S.sel.ver; S.decision='ok'; go('detail'); }
function send(t){ t=(t||'').trim(); if(!t) return; S.msgs=[...(S.msgs||AI_INIT),{r:'u',t},{r:'t'}]; render(true);
  setTimeout(()=>{ S.msgs.pop(); S.msgs.push({r:'a',t:ANSWERS[t]||'我查阅了成衣一组的开发案、QC 与订单记录。这是演示环境，真实版本会基于实时业务数据回答，并附上来源。',src:ANSWERS[t]?['开发案','QC 报告','订单']:null}); render(true); },900); }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a;
  if(a==='nav'){ const v=el.dataset.v; if(VIEWS[v]) go(v); else say(`「${el.dataset.l||'该模块'}」不在本次 Demo 范围`); }
  else if(a==='open') open(el.dataset.i||0);
  else if(a==='select'){ const d=DEVS[+el.dataset.i]; if(S.sel===d){ open(el.dataset.i); } else { S.sel=d; render(true);} }
  else if(a==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; S.palette=false; render(true); }
  else if(a==='collapse'){ S.collapsed=!S.collapsed; render(true); }
  else if(a==='group'){ S.closed[el.dataset.g]=!S.closed[el.dataset.g]; render(true); }
  else if(a==='palette'){ S.palette=true; S.pq=''; render(true); }
  else if(a==='ai'){ S.ai=true; S.palette=false; render(true); }
  else if(a==='close'){ S.palette=false; S.ai=false; render(true); }
  else if(a==='toast') say(el.dataset.m);
  else if(a==='range'){ S.range=el.dataset.k; render(true); }
  else if(a==='tab'){ S.tab=el.dataset.k; render(true); }
  else if(a==='stage'){ S.stage=+el.dataset.k; render(true); }
  else if(a==='clear'){ S.stage=-1; S.q=''; render(true); }
  else if(a==='ver'){ S.ver=el.dataset.k; render(true); }
  else if(a==='decide'){ S.decision=el.dataset.k; render(true); }
  else if(a==='confirm'){ const d=S.sel; if(S.decision==='ok'){ d.stage=4; d.state='已确认 · 留档'; d.tone='ok'; } else if(S.decision==='mod'){ d.state='待改版'; d.tone='warn'; } else { d.state='不采用'; d.tone='bad'; } say(S.decision==='ok'?'已确认 R2-A-2，进入成果留档':'已记录需求方意见'); }
  else if(a==='ask') send(el.dataset.m);
  else if(a==='send') send(document.getElementById('aiq').value);
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); S.palette=!S.palette; S.pq=''; render(true); }
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='j'){ e.preventDefault(); S.ai=!S.ai; render(true); }
  else if(e.key==='Escape'&&(S.palette||S.ai)){ S.palette=false; S.ai=false; render(true); }
  else if(e.key==='Enter'&&S.palette){ const b=document.querySelector('.palette .it'); if(b) b.click(); }
});
render();
if(qs.get('palette')) { S.palette=true; render(true); }
if(qs.get('ai')) { S.ai=true; render(true); }
const sp=document.getElementById('splash');
if(qs.get('intro')==='0') sp.remove(); else setTimeout(()=>{sp.classList.add('out'); setTimeout(()=>sp.remove(),700);},1500);
</script></body></html>
