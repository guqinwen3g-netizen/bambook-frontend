name: Mist verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mist-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests that only touch documentation (docs/**, top-level *.md; see scripts/ci/classify-doc-changes.sh)
  # skip the full build and only get a whitespace check. Pushes to main and manual runs always run the full verification (delivery depends on it).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test change classifier
        run: bash scripts/ci/classify-doc-changes.test.sh
      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # NUL-separated paths (Chinese / spaces / quotes safe); renames count the old path; whitespace check for docs-only.
        run: bash scripts/ci/classify-doc-changes.sh "$EVENT" "$BASE" "$HEAD"
  verify:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use repository Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Generate Prisma client
        working-directory: server
        run: npm exec -- prisma generate
      - name: Verify current Mist application
        run: npm run verify:mist
  report:
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
      actions: read
      pull-requests: write
    steps:
      - name: Publish result as commit status and report failures on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          verify_JSON: ${{ toJSON(needs) }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTEXT: ci/mist-verify
        run: |
          set -euo pipefail
          summary=$(jq -r 'to_entries | map("\(.key)=\(.value.result)") | join(" ")' <<<"$verify_JSON")
          if jq -e 'any(.[]; .result == "failure")' <<<"$verify_JSON" >/dev/null; then state=failure
          elif jq -e 'any(.[]; .result == "cancelled")' <<<"$verify_JSON" >/dev/null; then state=error
          else state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$CONTEXT" \
            -f target_url="$RUN_URL" -f description="${summary:0:140}" >/dev/null
          echo "status $CONTEXT=$state ($summary) on $SHA"
          [ "$state" = success ] && exit 0
          [ -n "$PR" ] || exit 0
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100")
          {
            echo "### CI \`$CONTEXT\`: **$state** on \`${SHA:0:7}\`"
            echo "Run: $RUN_URL"
            echo
            jq -r '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "- job **\(.name)** (\(.conclusion)): " + ([.steps[]? | select(.conclusion == "failure") | .name] | join(", "))' <<<"$jobs"
            for id in $(jq -r '.jobs[] | select(.conclusion == "failure") | .id' <<<"$jobs"); do
              name=$(jq -r --argjson id "$id" '.jobs[] | select(.id == $id) | .name' <<<"$jobs")
              echo
              echo "<details open><summary>Log tail: $name</summary>"
              echo
              echo '```'
              gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" 2>&1 \
                | sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/^[0-9T:.-]*Z //' | grep -v '^##\[group\]\|^##\[endgroup\]' \
                | tail -n 80 | cut -c1-300 | sed 's/```/` ` `/g'
              echo '```'
              echo "</details>"
            done
          } > "$RUNNER_TEMP/ci-report.md"
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/ci-report.md"
