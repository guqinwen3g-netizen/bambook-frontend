name: Bambook development delivery
on:
  pull_request:
    paths:
      - .github/workflows/bambook-dev-deploy.yml
      - scripts/deploy/**
  workflow_dispatch:
    inputs:
      mode:
        description: Check the channel, or deploy the verified main revision
        required: true
        default: check
        type: choice
        options: [check, deploy]
permissions:
  contents: read
  checks: read
concurrency:
  group: bambook-development-delivery
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/deploy/test_bambook_dev_receiver.py
      - run: bash -n scripts/deploy/bambook-dev-release.sh && bash -n scripts/deploy/bootstrap-dev-server.sh && bash -n server/scripts/init-dev-database.sh
  delivery:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: 124.222.56.61
      DEPLOY_USER: bambook-deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require successful application verification for deployment
        if: inputs.mode == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '.check_runs | any(.name == "verify" and .status == "completed" and .conclusion == "success")' | grep -qx true
      - name: Configure dedicated SSH identity and pinned host key
        env:
          DEPLOY_KEY: ${{ secrets.BAMBOOK_DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BAMBOOK_DEV_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/bambook-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/bambook-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/bambook-ssh/known_hosts"
      - name: Check delivery channel
        run: |
          ssh -i "$RUNNER_TEMP/bambook-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/bambook-ssh/known_hosts" \
            -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" check
      - name: Use repository Node version
        if: inputs.mode == 'deploy'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build same-origin web frontend
        if: inputs.mode == 'deploy'
        env:
          BAMBOOK_WEB_SUBDOMAIN: '1'
          VITE_API_BASE_URL: /api
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          # Same revision must produce the same bundle bytes (receiver replay check): pin the build start time.
          node -e 'const f="dist/mist-version.json",fs=require("fs"),v=JSON.parse(fs.readFileSync(f));v.startedAt=v.committedAt;fs.writeFileSync(f,JSON.stringify(v))'
      - name: Send verified release and activate
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          stage="$RUNNER_TEMP/bundle"
          rm -rf "$stage" && mkdir -p "$stage/web"
          git archive --format=tar HEAD .nvmrc server scripts/deploy/bambook-dev-release.sh | tar -x -C "$stage"
          # Legacy map datasets in public/ are not used by the Mist renderer; keep the bundle small.
          tar -c -C dist --exclude=./data --exclude=./geo --exclude=./glyphs --exclude='./*.geojson' --exclude='./earth_*' . | tar -x -C "$stage/web"
          test -f "$stage/web/index.html"
          test -z "$(find "$stage" -type l -print -quit)"
          tar -c -C "$stage" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner .nvmrc server scripts web | gzip -n > "$RUNNER_TEMP/backend.tar.gz"
          ssh_options=(-i "$RUNNER_TEMP/bambook-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/bambook-ssh/known_hosts" -o ConnectTimeout=15)
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "receive $GITHUB_SHA" < "$RUNNER_TEMP/backend.tar.gz"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "activate $GITHUB_SHA"
      - name: Remove temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/bambook-ssh"
