name: Bambook development ops channel

# Agent / 维护者访问开发服务器的统一通道（只需仓库 contents 写权限）：
#   1. 在 ops-channel 分支上提交 ops/request.sh（要在开发服务器上执行的 bash 脚本）；
#   2. 本工作流用仓库 secret BAMBOOK_DEV_OPS_SSH_KEY 以 bambook-ops（可 sudo）登录开发服务器执行；
#   3. 结果（退出码 + 脱敏输出）提交回 ops-channel：ops/results/<请求提交>.md 与 ops/last-result.md。
# 只接受仓库所有者推送；只连开发服务器（不涉及 Mac mini、正式域名与真实资金）。
on:
  push:
    branches: [ops-channel]
    paths: [ops/request.sh]

permissions:
  contents: write

concurrency:
  group: bambook-dev-ops
  cancel-in-progress: false

env:
  DEV_HOST: 124.222.56.61
  DEV_USER: bambook-ops

jobs:
  run:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Check out exactly the pushed request commit. The branch keeps moving (result commits, newer
      # requests), so reading "latest ops-channel" could miss or swap the request.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Configure SSH identity and pinned host key
        env:
          OPS_KEY: ${{ secrets.BAMBOOK_DEV_OPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BAMBOOK_DEV_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OPS_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$OPS_KEY" > "$RUNNER_TEMP/ops_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
      - name: Load request script of the triggering commit
        id: request
        env:
          REQUEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
          git show "$REQUEST_SHA:ops/request.sh" > "$RUNNER_TEMP/request.sh"
          test -s "$RUNNER_TEMP/request.sh" || { echo '::error::ops/request.sh is empty'; exit 1; }
          echo "sha256=$(sha256sum "$RUNNER_TEMP/request.sh" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          source_sha=$(sed -nE 's/^# capacity-source-main: ([0-9a-f]{40})$/\1/p' "$RUNNER_TEMP/request.sh")
          if [ -n "$source_sha" ]; then
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$source_sha" = "$(git ls-remote origin refs/heads/main | cut -f1)"
            echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          fi
      - name: Read exact main source for an isolated capacity trial
        if: steps.request.outputs.source_sha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.request.outputs.source_sha }}
          path: capacity-source
          persist-credentials: false
      - name: Transfer source through the existing pinned ops channel
        if: steps.request.outputs.source_sha != ''
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C capacity-source rev-parse HEAD)" = "$SOURCE_SHA"
          # Source only: no credentials, node_modules, build output or running application data.
          git -C capacity-source archive --format=tar "$SOURCE_SHA" | gzip -1 > "$RUNNER_TEMP/capacity-source.tar.gz"
          digest=$(sha256sum "$RUNNER_TEMP/capacity-source.tar.gz" | cut -d' ' -f1)
          echo "capacity source sha=$SOURCE_SHA archive-sha256=$digest bytes=$(stat -c%s "$RUNNER_TEMP/capacity-source.tar.gz")"
          timeout 120 ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -i "$RUNNER_TEMP/ops_key" \
            "$DEV_USER@$DEV_HOST" "umask 077; root=/var/tmp/bambook-ci-capacity-$SOURCE_SHA; test ! -e \$root && mkdir -m 700 \$root && mkdir \$root/source && cat > \$root/source.tar.gz && echo '$digest  '\$root/source.tar.gz | sha256sum -c - && echo '$digest' > \$root/source.sha256 && tar -xzf \$root/source.tar.gz -C \$root/source && rm \$root/source.tar.gz" < "$RUNNER_TEMP/capacity-source.tar.gz"
      - name: Run request on development server
        id: run
        run: |
          set -uo pipefail
          start=$(date +%s)
          set +e
          timeout 900 ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -i "$RUNNER_TEMP/ops_key" \
            "$DEV_USER@$DEV_HOST" 'bash -s' < "$RUNNER_TEMP/request.sh" > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          set -e
          rm -f "$RUNNER_TEMP/ops_key"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      - name: Redact and commit result
        if: always()
        env:
          REQUEST_SHA: ${{ github.sha }}
          REQUEST_SHA256: ${{ steps.request.outputs.sha256 }}
          CODE: ${{ steps.run.outputs.code }}
          SECONDS_USED: ${{ steps.run.outputs.seconds }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, datetime
          t = os.environ['RUNNER_TEMP']
          try: out = open(os.path.join(t, 'out.txt'), errors='replace').read()
          except FileNotFoundError: out = '(no output captured)'
          pats = [
            (r'-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----', '[REDACTED PRIVATE KEY]'),
            (r'(postgres(?:ql)?://[^:\s/]+:)[^@\s]+@', r'\1[REDACTED]@'),
            (r'\b(sk-[A-Za-z0-9_\-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})', '[REDACTED TOKEN]'),
            (r'(?im)^(\s*(?:export\s+)?[A-Z0-9_]*(?:SECRET|TOKEN|API_KEY|PASSWORD|PASSWD)[A-Z0-9_]*\s*[=:]\s*).+$', r'\1[REDACTED]'),
          ]
          for p, r in pats: out = re.sub(p, r, out, flags=re.S)
          limit = 200000
          if len(out) > limit: out = '…(truncated, showing last %d chars)…\n' % limit + out[-limit:]
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          body = (f"request: {os.environ['REQUEST_SHA']}\nrequest-sha256: {os.environ.get('REQUEST_SHA256') or 'not loaded'}\n"
                  f"exit: {os.environ.get('CODE') or 'not run'}\n"
                  f"seconds: {os.environ.get('SECONDS_USED') or '?'}\nfinished: {now}\nrun: {os.environ['RUN_URL']}\n"
                  f"---\n{out}")
          open(os.path.join(t, 'result.md'), 'w').write(body)
          PY
          git config user.name 'bambook-ops-bot'
          git config user.email 'bambook-ops-bot@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin ops-channel && git reset -q --hard origin/ops-channel
            mkdir -p ops/results
            cp "$RUNNER_TEMP/result.md" "ops/results/$REQUEST_SHA.md"
            cp "$RUNNER_TEMP/result.md" ops/last-result.md
            git add ops/results ops/last-result.md
            git commit -q -m "ops result for ${REQUEST_SHA:0:7} (exit ${CODE:-none})"
            git push -q origin HEAD:ops-channel && break
            sleep 3
          done
          test "${CODE:-1}" = 0
