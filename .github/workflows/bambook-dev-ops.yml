name: Bambook development ops channel

# Agent / 维护者访问开发服务器的统一通道（只需仓库 contents 写权限）：
#   1. 在 ops-channel 分支上提交 ops/request.sh（要在开发服务器上执行的 bash 脚本）；
#   2. 本工作流用仓库 secret BAMBOOK_DEV_OPS_SSH_KEY 以 bambook-ops（可 sudo）登录开发服务器执行；
#   3. 结果（退出码 + 脱敏输出）提交回 ops-channel：ops/results/<请求提交>.md 与 ops/last-result.md。
# 只接受仓库所有者推送；只连开发服务器（不涉及 Mac mini、正式域名与真实资金）。
on:
  push:
    branches: [ops-channel]
    paths: [ops/request.sh]

permissions:
  contents: write

concurrency:
  group: bambook-dev-ops
  cancel-in-progress: false

env:
  DEV_HOST: 124.222.56.61
  DEV_USER: bambook-ops

jobs:
  run:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Check out exactly the pushed request commit. The branch keeps moving (result commits, newer
      # requests), so reading "latest ops-channel" could miss or swap the request.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Configure SSH identity and pinned host key
        env:
          OPS_KEY: ${{ secrets.BAMBOOK_DEV_OPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BAMBOOK_DEV_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OPS_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$OPS_KEY" > "$RUNNER_TEMP/ops_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
      - name: Load request script of the triggering commit
        id: request
        env:
          REQUEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
          git show "$REQUEST_SHA:ops/request.sh" > "$RUNNER_TEMP/request.sh"
          test -s "$RUNNER_TEMP/request.sh" || { echo '::error::ops/request.sh is empty'; exit 1; }
          echo "sha256=$(sha256sum "$RUNNER_TEMP/request.sh" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          source_sha=$(sed -nE 's/^# capacity-source-main: ([0-9a-f]{40})$/\1/p' "$RUNNER_TEMP/request.sh")
          if [ -n "$source_sha" ]; then
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$source_sha" = "$(git ls-remote origin refs/heads/main | cut -f1)"
            echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          fi
      - name: Read exact main source for an isolated capacity trial
        if: steps.request.outputs.source_sha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.request.outputs.source_sha }}
          path: capacity-source
          persist-credentials: false
      - name: Transfer source through the existing pinned ops channel
        if: steps.request.outputs.source_sha != ''
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C capacity-source rev-parse HEAD)" = "$SOURCE_SHA"
          # Source only: no credentials, node_modules, build output or running application data.
          python3 - <<'PACK_SOURCE'
          import gzip,hashlib,io,json,os,pathlib,subprocess,tarfile
          root=pathlib.Path('capacity-source'); manifest=[]; included=[]; omitted=[]
          items=subprocess.check_output(['git','-C',str(root),'ls-tree','-rz','HEAD']).split(b'\0')
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'capacity-source.tar.gz'
          with archive.open('wb') as raw,gzip.GzipFile(fileobj=raw,mode='wb',compresslevel=9,mtime=0) as zipped,tarfile.open(fileobj=zipped,mode='w|') as tar:
           for row in items:
            if not row:continue
            meta,name=row.split(b'\t',1);mode,kind,blob=meta.split();name=name.decode()
            if kind!=b'blob' or mode not in (b'100644',b'100755'):raise RuntimeError('unsupported source mode: '+name)
            data=(root/name).read_bytes()
            if name.startswith('server/'):
             manifest.append({'path':name,'sha256':hashlib.sha256(data).hexdigest(),'mode':int(mode,8)&0o777});continue
            if (name.startswith('docs/') and not name.startswith('docs/mist-atelier/')) or name.startswith(('build/','public/data/','public/geo/','public/glyphs/','public/earth_')) or (name.startswith('public/') and name.endswith('.geojson')):
             omitted.append(name);continue
            entry=tarfile.TarInfo(name);entry.size=len(data);entry.mode=int(mode,8)&0o777;entry.mtime=0;tar.addfile(entry,io.BytesIO(data));included.append(name)
           data=json.dumps(manifest).encode();entry=tarfile.TarInfo('capacity-server-source.json');entry.size=len(data);entry.mode=0o600;tar.addfile(entry,io.BytesIO(data))
          covered=set(included)|{x['path'] for x in manifest}
          missing=[row.split(b'\t',1)[1].decode() for row in items if row and (b'.test.' in row or b'.spec.' in row) and row.split(b'\t',1)[1].decode() not in covered]
          if missing:raise RuntimeError('omitted tests: '+repr(missing))
          print(json.dumps({'archive_bytes':archive.stat().st_size,'transferred_files':len(included),'server_files_verified_from_exact_release':len(manifest),'omitted_assets_or_documentation':len(omitted),'omitted_tests':missing}))
          PACK_SOURCE
          digest=$(sha256sum "$RUNNER_TEMP/capacity-source.tar.gz" | cut -d' ' -f1)
          echo "capacity source sha=$SOURCE_SHA archive-sha256=$digest bytes=$(stat -c%s "$RUNNER_TEMP/capacity-source.tar.gz")"
          ssh_options=(-T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o IPQoS=throughput -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -i "$RUNNER_TEMP/ops_key")
          root="/var/tmp/bambook-ci-capacity-$SOURCE_SHA"
          begin=$(date +%s)
          head -c 65536 "$RUNNER_TEMP/capacity-source.tar.gz" | timeout --kill-after=10 30 ssh "${ssh_options[@]}" "$DEV_USER@$DEV_HOST" "set -e; umask 077; mkdir -p '$root/source'; cat > '$root/transport-probe.bin'; stat -c 'probe_bytes=%s' '$root/transport-probe.bin'"
          echo "64KiB probe seconds including SSH connection=$(( $(date +%s)-begin ))"
          meta=$(timeout --kill-after=10 30 ssh "${ssh_options[@]}" "$DEV_USER@$DEV_HOST" "set -e; test ! -e '$root/source.sha256'; if test -f '$root/required-source.tar.gz'; then stat -c%s '$root/required-source.tar.gz'; sha256sum '$root/required-source.tar.gz' | cut -d' ' -f1; else echo 0; echo empty; fi")
          offset=$(head -1 <<<"$meta"); remote_prefix=$(tail -1 <<<"$meta")
          [[ "$offset" =~ ^[0-9]+$ ]]
          test "$offset" -le "$(stat -c%s "$RUNNER_TEMP/capacity-source.tar.gz")"
          if [ "$offset" -gt 0 ]; then
            test "$(head -c "$offset" "$RUNNER_TEMP/capacity-source.tar.gz" | sha256sum | cut -d' ' -f1)" = "$remote_prefix"
          fi
          echo "resuming verified required-source prefix at byte $offset"
          tail -c "+$((offset + 1))" "$RUNNER_TEMP/capacity-source.tar.gz" | \
            timeout --kill-after=10 600 ssh "${ssh_options[@]}" "$DEV_USER@$DEV_HOST" \
            "set -e; umask 077; cat >> '$root/required-source.tar.gz'; echo '$digest  $root/required-source.tar.gz' | sha256sum -c -; echo '$digest' > '$root/source.sha256'; tar -xzf '$root/required-source.tar.gz' -C '$root/source'; rm '$root/required-source.tar.gz'"
          timeout --kill-after=10 60 ssh "${ssh_options[@]}" "$DEV_USER@$DEV_HOST" "python3 - '$SOURCE_SHA'" <<'COPY_SOURCE'
          import hashlib,json,pathlib,shutil,sys
          sha=sys.argv[1];root=pathlib.Path('/var/tmp/bambook-ci-capacity-'+sha);source=root/'source';release=pathlib.Path('/srv/bambook-dev/releases')/sha
          manifest=json.loads((source/'capacity-server-source.json').read_text())
          for item in manifest:
           relative=pathlib.PurePosixPath(item['path'])
           if not str(relative).startswith('server/') or '..' in relative.parts:raise RuntimeError('invalid source path')
           origin=release/relative
           if origin.is_symlink() or hashlib.sha256(origin.read_bytes()).hexdigest()!=item['sha256']:raise RuntimeError('fixed release source mismatch: '+str(relative))
           target=source/relative;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(origin,target);target.chmod(item['mode'])
          (source/'capacity-server-source.json').unlink()
          print('verified and copied exact-release controlled server files: '+str(len(manifest)))
          COPY_SOURCE
      - name: Run request on development server
        id: run
        run: |
          set -uo pipefail
          start=$(date +%s)
          set +e
          timeout 900 ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -i "$RUNNER_TEMP/ops_key" \
            "$DEV_USER@$DEV_HOST" 'bash -s' < "$RUNNER_TEMP/request.sh" > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          set -e
          rm -f "$RUNNER_TEMP/ops_key"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      - name: Redact and commit result
        if: always()
        env:
          REQUEST_SHA: ${{ github.sha }}
          REQUEST_SHA256: ${{ steps.request.outputs.sha256 }}
          CODE: ${{ steps.run.outputs.code }}
          SECONDS_USED: ${{ steps.run.outputs.seconds }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, datetime
          t = os.environ['RUNNER_TEMP']
          try: out = open(os.path.join(t, 'out.txt'), errors='replace').read()
          except FileNotFoundError: out = '(no output captured)'
          pats = [
            (r'-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----', '[REDACTED PRIVATE KEY]'),
            (r'(postgres(?:ql)?://[^:\s/]+:)[^@\s]+@', r'\1[REDACTED]@'),
            (r'\b(sk-[A-Za-z0-9_\-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})', '[REDACTED TOKEN]'),
            (r'(?im)^(\s*(?:export\s+)?[A-Z0-9_]*(?:SECRET|TOKEN|API_KEY|PASSWORD|PASSWD)[A-Z0-9_]*\s*[=:]\s*).+$', r'\1[REDACTED]'),
          ]
          for p, r in pats: out = re.sub(p, r, out, flags=re.S)
          limit = 200000
          if len(out) > limit: out = '…(truncated, showing last %d chars)…\n' % limit + out[-limit:]
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          body = (f"request: {os.environ['REQUEST_SHA']}\nrequest-sha256: {os.environ.get('REQUEST_SHA256') or 'not loaded'}\n"
                  f"exit: {os.environ.get('CODE') or 'not run'}\n"
                  f"seconds: {os.environ.get('SECONDS_USED') or '?'}\nfinished: {now}\nrun: {os.environ['RUN_URL']}\n"
                  f"---\n{out}")
          open(os.path.join(t, 'result.md'), 'w').write(body)
          PY
          git config user.name 'bambook-ops-bot'
          git config user.email 'bambook-ops-bot@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin ops-channel && git reset -q --hard origin/ops-channel
            mkdir -p ops/results
            cp "$RUNNER_TEMP/result.md" "ops/results/$REQUEST_SHA.md"
            cp "$RUNNER_TEMP/result.md" ops/last-result.md
            git add ops/results ops/last-result.md
            git commit -q -m "ops result for ${REQUEST_SHA:0:7} (exit ${CODE:-none})"
            git push -q origin HEAD:ops-channel && break
            sleep 3
          done
          test "${CODE:-1}" = 0
